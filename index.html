<!doctype html>
<!-- lang="pt" (2026-08-07, SEO audit item 2): matches AppContext's own
     readStoredLang() ?? 'pt' default -- Portuguese is this storefront's
     actual default language, not English. This is only the pre-hydration
     value a crawler/first paint sees; src/state/AppContext.tsx keeps
     document.documentElement.lang in sync with the live `lang` state after
     that, including across a language-toggle click. -->
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Crawler-visible site defaults. React replaces these with localized,
         route-specific values after hydration; non-JS link-preview bots still
         receive a complete branded preview instead of an empty SPA shell. -->
    <title>Use Me With Style | Moda desportiva feminina</title>
    <meta name="description" content="Moda desportiva feminina para Angola e Portugal — leggings, conjuntos fitness e vestidos, com entrega em Luanda e em toda a Europa." />
    <meta property="og:title" content="Use Me With Style | Moda desportiva feminina" />
    <meta property="og:description" content="Moda desportiva feminina para Angola e Portugal — leggings, conjuntos fitness e vestidos, com entrega em Luanda e em toda a Europa." />
    <meta property="og:image" content="https://ao.usemewithstyle.shop/brand/use-me-logo-black-transparent.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Use Me With Style" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Use Me With Style | Moda desportiva feminina" />
    <meta name="twitter:description" content="Moda desportiva feminina para Angola e Portugal — leggings, conjuntos fitness e vestidos, com entrega em Luanda e em toda a Europa." />
    <meta name="twitter:image" content="https://ao.usemewithstyle.shop/brand/use-me-logo-black-transparent.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
