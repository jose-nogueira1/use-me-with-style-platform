<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Use Me With Style - Storefront Phase 1 Review</title>
    <style>
      :root {
        --ink: #171514;
        --muted: #6c655d;
        --paper: #fffdf8;
        --ivory: #f8f4ec;
        --line: #d8cdb7;
        --gold: #caa039;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--ivory);
        color: var(--ink);
        font-family:
          Montserrat,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(1440px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      header {
        display: grid;
        gap: 10px;
        margin-bottom: 28px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 760px;
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
        text-decoration: none;
      }

      .button.primary {
        border-color: #050505;
        background: #050505;
        color: #e5c24f;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        align-items: start;
      }

      figure {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--paper);
        box-shadow: 0 18px 54px rgba(23, 21, 20, 0.08);
      }

      figure.wide {
        grid-column: 1 / -1;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        background: var(--paper);
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      figcaption span:first-child {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Storefront Phase 1 Review</h1>
        <p>
          High-fidelity storefront screenshots exported from the local design
          board. Open any image in a new tab for full-size review.
        </p>
        <nav class="links" aria-label="Design links">
          <a class="button primary" href="./00-board-overview.png">Open overview PNG</a>
          <a class="button" href="../../phase-1-storefront-high-fidelity.html">Open HTML design board</a>
          <a class="button" href="../../figma/README.md">Open Figma import kit</a>
        </nav>
      </header>

      <section class="grid">
        <figure class="wide">
          <a href="./00-board-overview.png"><img src="./00-board-overview.png" alt="Board overview" /></a>
          <figcaption><span>Board Overview</span><span>00</span></figcaption>
        </figure>
        <figure>
          <a href="./00-cover.png"><img src="./00-cover.png" alt="Cover" /></a>
          <figcaption><span>Cover</span><span>00</span></figcaption>
        </figure>
        <figure>
          <a href="./00-design-system.png"><img src="./00-design-system.png" alt="Design system direction" /></a>
          <figcaption><span>Design System</span><span>00</span></figcaption>
        </figure>
        <figure>
          <a href="./01-mobile-home.png"><img src="./01-mobile-home.png" alt="Mobile home storefront screen" /></a>
          <figcaption><span>Mobile Home</span><span>01</span></figcaption>
        </figure>
        <figure>
          <a href="./02-mobile-browse-filter.png"><img src="./02-mobile-browse-filter.png" alt="Mobile browse and filter storefront screen" /></a>
          <figcaption><span>Browse and Filter</span><span>02</span></figcaption>
        </figure>
        <figure>
          <a href="./03-mobile-product-detail.png"><img src="./03-mobile-product-detail.png" alt="Mobile product detail storefront screen" /></a>
          <figcaption><span>Product Detail</span><span>03</span></figcaption>
        </figure>
        <figure>
          <a href="./04-mobile-cart.png"><img src="./04-mobile-cart.png" alt="Mobile cart storefront screen" /></a>
          <figcaption><span>Cart</span><span>04</span></figcaption>
        </figure>
        <figure>
          <a href="./05-mobile-checkout.png"><img src="./05-mobile-checkout.png" alt="Mobile checkout storefront screen" /></a>
          <figcaption><span>Checkout</span><span>05</span></figcaption>
        </figure>
        <figure>
          <a href="./06-mobile-confirmation-lookup.png"><img src="./06-mobile-confirmation-lookup.png" alt="Mobile confirmation and order lookup screen" /></a>
          <figcaption><span>Confirmation and Lookup</span><span>06</span></figcaption>
        </figure>
        <figure class="wide">
          <a href="./07-desktop-home-collection.png"><img src="./07-desktop-home-collection.png" alt="Desktop home and collection storefront screen" /></a>
          <figcaption><span>Desktop Home and Collection</span><span>07</span></figcaption>
        </figure>
        <figure>
          <a href="./08-tablet-product-detail.png"><img src="./08-tablet-product-detail.png" alt="Tablet product detail storefront screen" /></a>
          <figcaption><span>Tablet Product Detail</span><span>08</span></figcaption>
        </figure>
        <figure>
          <a href="./09-figma-handoff.png"><img src="./09-figma-handoff.png" alt="Figma handoff checklist" /></a>
          <figcaption><span>Figma Handoff</span><span>09</span></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
